{en:['Corridor of Courage','Classmates repeatedly mock a student in the corridor. What should you do?',['Join in to fit in.','Support the student safely and tell a trusted adult.','Record and share a video.'],1,'Safe support and adult help can make a difference.'],ar:['ممر الشجاعة','يسخر بعض الطلبة مراراً من زميل في الممر. ماذا تفعل؟',['شاركهم السخرية.','ساند الطالب بأمان وأخبر شخصاً بالغاً موثوقاً.','صور المشهد وانشره.'],1,'الدعم الآمن ومساعدة الكبار يصنعان فرقاً.']},

{en:['Trusted Adult Path','A student tells you they are afraid to report repeated bullying.',['Promise to keep it secret no matter what.','Listen kindly and help them speak to a trusted adult.','Tell them they must solve it alone.'],1,'Trusted adults are essential to keeping students safe.'],ar:['طريق الشخص الموثوق','أخبرك طالب أنه يخشى الإبلاغ عن تنمر متكرر.',['عده بإخفاء الأمر مهما حدث.','استمع بلطف وساعده على الحديث مع شخص بالغ موثوق.','قل له أن يحل الأمر وحده.'],1,'للكبار الموثوقين دور أساسي في حماية الطلبة.']},

let lang='en', mode='student',done=new Set(JSON.parse(localStorage.getItem('hxDone')||'[]')),current=0,finalPassed=localStorage.getItem('hxFinal')==='yes',audio=false,keys={},yaw=0,pitch=0,drag=false,px=0,py=0;
const t=()=>lang==='en'?EN:AR,$=id=>document.getElementById(id);
const recordedAudio=new Audio(); recordedAudio.preload='auto';let speechSequence=0;
const userArabicClips={};
const audioHint='Arabic narration requires a compatible Arabic voice or real Arabic audio files. Upload your own recordings with the Arabic Audio button.';

const voiceClips={
 ar:{
  test:'audio/ar/test.mp3',welcome:'audio/ar/welcome.mp3',start:'audio/ar/start.mp3'
 },
 en:{test:'audio/en/test.mp3',welcome:'audio/en/welcome.mp3',start:'audio/en/start.mp3'}
};
function availableVoices(){return ('speechSynthesis' in window)?speechSynthesis.getVoices():[]}
function pickVoice(){
 const prefix=lang==='ar'?'ar':'en';
 return availableVoices().filter(v=>v.lang.toLowerCase().startsWith(prefix))
 .sort((a,b)=>Number(/natural|neural|premium|google|microsoft|siri/i.test(b.name))-Number(/natural|neural|premium|google|microsoft|siri/i.test(a.name)))[0]||null;
}
function voiceStatus(message){$('voiceStatus').textContent=message}
function stopVoice(){speechSequence++;recordedAudio.pause();recordedAudio.removeAttribute('src');recordedAudio.load();if('speechSynthesis' in window)speechSynthesis.cancel()}
async function waitVoices(){
 if(!('speechSynthesis' in window))return [];
 let v=availableVoices();if(v.length)return v;
 return new Promise(resolve=>{let finished=false;const finish=()=>{if(finished)return;finished=true;resolve(availableVoices())};speechSynthesis.addEventListener('voiceschanged',finish,{once:true});setTimeout(finish,1800)})
}
async function say(s,clip){
 if(!audio)return;
 stopVoice();const token=speechSequence;
 if(clip){const path=(lang==='ar'&&userArabicClips[clip])||voiceClips[lang]?.[clip];if(path){
  try{const response=path.startsWith('blob:')?{ok:true}:await fetch(path,{method:'HEAD'});if(response.ok&&token===speechSequence){
   recordedAudio.src=path;recordedAudio.volume=1;
   recordedAudio.onerror=()=>voiceStatus(lang==='ar'?'تعذر تشغيل الملف الصوتي العربي':'Recorded audio failed');
   await recordedAudio.play();voiceStatus(lang==='ar'?'🔊 تسجيل صوتي عربي':'🔊 English recorded audio');return;
  }}catch(e){}
 }}
 await waitVoices();if(token!==speechSequence)return;
 const voice=pickVoice();
 if(!voice){voiceStatus(lang==='ar'?'⚠ لا يوجد صوت عربي مثبت. اضغط 📁 صوت عربي لإضافة تسجيلات MP3 عربية حقيقية.':'⚠ No compatible voice installed.');return}
 const utterance=new SpeechSynthesisUtterance(s);utterance.voice=voice;utterance.lang=voice.lang;
 utterance.rate=lang==='ar'?.86:.91;utterance.pitch=1;utterance.volume=1;
 utterance.onstart=()=>voiceStatus((lang==='ar'?'🔊 يتحدث الآن: ':'🔊 Speaking: ')+voice.name);
 utterance.onerror=e=>voiceStatus((lang==='ar'?'⚠ تعذر تشغيل الصوت: ':'⚠ Speech failed: ')+e.error);
 utterance.onend=()=>voiceStatus(lang==='ar'?'✓ انتهى المقطع الصوتي':'✓ Narration finished');
 speechSynthesis.speak(utterance);
}
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',()=>{if(lang==='ar'&&!pickVoice())voiceStatus('⚠ لا يوجد صوت عربي مثبت على الجهاز')});
function save(){localStorage.setItem('hxDone',JSON.stringify([...done]))}function modal(html){$('dialog').innerHTML=html;$('modal').classList.remove('hidden')}function close(){ $('modal').classList.add('hidden');stopVoice()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function welcome(){modal(`<img class="school-logo" src="./ics-logo.png" alt="ICS school logo"><h1>🛡 ${t().welcome}</h1><p>${t().welcomeText}</p><p class="small">${t().voice}</p><p>🌈 ⭐ 🛡️ 💙 ✨</p><label>${t().mode}</label><div class="actions"><button data-mode="student">${t().student}</button><button data-mode="family">${t().family}</button><button data-mode="staff">${t().staff}</button></div><p class="small" id="selection">${t()[mode]}</p><button id="begin">${t().start}</button>`);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('selection').textContent=t()[mode]});$('begin').onclick=()=>{audio=true;$('sound').textContent='🔊';close();render();say(lang==='ar'?'مرحباً! أنا صديقك حماية. اختر المهمة الأولى، وسأرافقك خطوة بخطوة.':'Hello! I am your HIMAYA buddy. Choose the first mission and I will guide you step by step.','start')};say(t().welcome,'welcome')}
function render(){document.documentElement.lang=lang;document.body.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';$('status').textContent=`${t().progress}: ${done.size}/8`; $('place').textContent=t().place;$('intro').textContent=t().intro;$('missions').innerHTML=missions.map((m,i)=>`<button class="${done.has(i)?'done':''}" data-m="${i}">${i+1} ${done.has(i)?'✓':'◇'}</button>`).join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{current=+b.dataset.m;teleport(current);startMission()});$('play').textContent='▶ '+t().mission;$('cert').textContent='★ '+t().certificate}
